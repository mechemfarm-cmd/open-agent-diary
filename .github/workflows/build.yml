name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backend regression tests
        run: |
          PYTHONPATH=src python3 -m unittest -v tests.test_append_entry_slice
          PYTHONPATH=src python3 -m compileall -q src scripts tests

  tauri-shell-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: agent-diary-linux
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact: agent-diary-macos
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: agent-diary-windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build experimental Tauri shell
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload experimental Tauri shell bundle
        uses: actions/upload-artifact@v4
        with:
          name: experimental-${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
