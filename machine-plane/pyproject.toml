[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-diary-machine-plane"
version = "0.0.1"
description = "Machine-observed evidence plane for Agent Diary: portable record, per-platform producers"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Willard Mechem" },
]
dependencies = []

[project.scripts]
machine-plane = "machine_plane.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
